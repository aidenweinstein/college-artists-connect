<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Talent · College Artists Connect</title>
<link rel="preload" href="/PragmaticaExt-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/site.css">
<script src="/site.js"></script>
</head>
<body>
  <!-- This page works for any chapter: it reads the chapter from its folder name (e.g. /ut-austin/).
       To give another chapter a talent page, copy this folder and rename it to that chapter's slug. -->
  <div class="wrap">
    <header class="nav">
      <a class="logo" href="/">College Artists <span>Connect</span></a>
      <nav>
        <a class="link" href="#featured">Featured</a>
        <a class="link" href="#a-z">A–Z</a>
      </nav>
    </header>
  </div>

  <div class="talent-hero" id="hero">
    <div class="wrap">
      <a class="back" href="/">← All chapters</a>
      <div class="tag">Talent</div>
      <h1 id="chapter-name">&nbsp;</h1>
      <p class="school" id="chapter-school">&nbsp;</p>
    </div>
  </div>

  <section id="featured">
    <div class="wrap">
      <h2>Featured</h2>
      <p class="sub">Artists the chapter is spotlighting right now.</p>
      <div class="featured-grid" id="featured-grid"></div>
    </div>
  </section>

  <section id="a-z">
    <div class="wrap">
      <h2>A–Z</h2>
      <p class="sub">Every artist represented by the chapter.</p>
      <div class="filters" id="filters" role="group" aria-label="Filter by discipline"></div>
      <div id="az"></div>
    </div>
  </section>

  <div class="wrap">
    <footer>
      <span>© <span id="yr"></span> College Artists Connect · collegeartistsconnect.org</span>
      <a class="admin-link" id="admin-link" href="admin/">Admin</a>
    </footer>
  </div>

<script>
  const chapter = chapterBySlug(currentSlug());
  let artists = [];
  let filter = "All";

  if (!chapter) {
    location.replace("/");
  } else {
    document.title = `${chapter.name} Talent · College Artists Connect`;
    const hero = document.getElementById("hero");
    hero.style.setProperty("--sec-bg", chapter.colors.bg);
    hero.style.setProperty("--sec-fg", chapter.colors.fg);
    document.getElementById("chapter-name").textContent = chapter.name;
    document.getElementById("chapter-school").textContent = `${chapter.school} · ${chapter.location}`;
    renderFilters();
    render();
    fetchArtists(chapter.slug)
      .then(list => { artists = list; render(); })
      .catch(err => {
        console.warn(err);
        document.getElementById("az").innerHTML = '<p class="empty-note">Couldn\'t load artists right now. Please try again later.</p>';
      });
  }

  /* An artist's card links to their page (if the admin added one). */
  function wrap(a, cls, inner) {
    return a && a.link
      ? `<a class="${cls}" href="${esc(a.link)}" target="_blank" rel="noopener">${inner}</a>`
      : `<div class="${cls}">${inner}</div>`;
  }

  function render() {
    const featured = artists.filter(a => a.featured);
    const grid = document.getElementById("featured-grid");
    grid.innerHTML = featured.length
      ? featured.map(a => wrap(a, "artist-card",
          `<div class="photo">${photoHtml(a, a.name)}</div>
           <div class="name">${esc(a.name)}</div>
           <div class="role">${esc(a.discipline)}</div>`)).join("")
      : DISCIPLINES.map(d => `<div class="artist-card empty">
           <div class="photo">${SILHOUETTE}</div>
           <div class="name">Coming soon</div>
           <div class="role">${d}</div></div>`).join("");

    const list = artists.filter(a => filter === "All" || a.discipline === filter);
    const az = document.getElementById("az");
    if (!list.length) {
      az.innerHTML = `<p class="empty-note">${artists.length ? "No artists in this category yet." : "No artists yet. Check back soon."}</p>`;
      return;
    }
    const groups = {};
    for (const a of list) {
      const letter = /[A-Za-z]/.test(a.name[0]) ? a.name[0].toUpperCase() : "#";
      (groups[letter] ||= []).push(a);
    }
    az.innerHTML = Object.keys(groups).sort().map(letter => `
      <h3 class="az-letter">${letter}</h3>
      <div class="az-list">${groups[letter].map(a => wrap(a, "az-row",
        `<div class="thumb">${photoHtml(a, "")}</div>
         <div><div class="name">${esc(a.name)}</div><div class="role">${esc(a.discipline)}</div></div>`)).join("")}
      </div>`).join("");
  }

  function renderFilters() {
    const el = document.getElementById("filters");
    const labels = { All: "All", Actor: "Actors", Musician: "Musicians", Filmmaker: "Filmmakers" };
    el.innerHTML = ["All", ...DISCIPLINES].map(d =>
      `<button class="chip" type="button" data-d="${d}" aria-pressed="${d === filter}">${labels[d]}</button>`).join("");
    el.onclick = e => {
      const b = e.target.closest("button[data-d]");
      if (!b) return;
      filter = b.dataset.d;
      renderFilters();
      render();
    };
  }
</script>
</body>
</html>
