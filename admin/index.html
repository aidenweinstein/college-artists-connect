<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Admin · College Artists Connect</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon-512.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preload" href="/PragmaticaExt-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/site.css?v=11">
<script src="/site.js?v=11"></script>
</head>
<body>
  <div class="wrap">
    <header class="nav">
      <a class="logo" href="/">College Artists <span>Connect</span></a>
    </header>
  </div>

  <main class="admin-main">
    <div class="wrap">
      <div class="panel login-panel">
        <h1 class="admin-h1">Chapter admin</h1>
        <p class="sub" style="margin-bottom:20px">Enter your chapter's admin password.</p>
        <form class="admin-form" id="login-form">
          <input type="text" name="username" autocomplete="username" value="College Artists Connect admin" readonly hidden>
          <label>Password
            <input type="password" id="password" autocomplete="current-password" required>
          </label>
          <button class="btn action" type="submit">Log in</button>
          <p class="notice" id="login-notice" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </main>

  <div class="wrap">
    <footer>
      <span>© <span id="yr"></span> College Artists Connect · collegeartistsconnect.org</span>
    </footer>
  </div>

<script>
  /* One login for every chapter: the talent API works out the chapter from the password,
     then this page sends the admin to that chapter's admin page (e.g. /usc/admin/). */
  const $ = id => document.getElementById(id);
  const note = (text, isError = false) => { $("login-notice").textContent = text; $("login-notice").classList.toggle("error", isError); };
  const destination = slug => { const c = chapterBySlug(slug); return c && c.talent ? `/${c.slug}/admin/` : null; };

  $("login-form").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = e.target.querySelector("button");
    btn.disabled = true;
    note("Checking…");
    try {
      let res;
      try {
        res = await fetch(`${TALENT_API}/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: $("password").value }),
        });
      } catch { throw new Error("Couldn't reach the server. Check your connection and try again."); }
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || "Something went wrong. Please try again.");
      const to = destination(body.slug);
      if (!to) throw new Error("That chapter doesn't have an admin page yet.");
      setAdminToken(body.slug, body.token);
      location.replace(to);
    } catch (err) {
      note(err.message, true);
      btn.disabled = false;
    }
  });
  $("password").focus();
</script>
</body>
</html>
